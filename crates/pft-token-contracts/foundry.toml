[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Base supports Cancun; pinned so the bytecode and the verification settings never drift.
evm_version = "cancun"
# The deploy script reads the compiler settings and writes the deployment record;
# its tests write their records under cache/deploy-test.
fs_permissions = [
    { access = "read", path = "./foundry.toml" },
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./cache/deploy-test" },
]

# Contract verification on Basescan. The key is read from the environment and is
# never written in this file.
[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base-sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 32
