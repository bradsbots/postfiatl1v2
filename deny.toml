[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2021-0127", reason = "serde_cbor is the pinned consensus wire codec for pfUSDC guest and host inputs. The advisory is unmaintained-only, with no vulnerability reported; changing encoders requires cross-guest byte-compatibility vectors and a separately gated migration. The 2026-08-31 target for moving to ciborium or minicbor has passed; the migration is still pending and no new date is set." },
  { id = "RUSTSEC-2021-0139", reason = "ansi_term is logging-only through SP1 slop-utils/tracing-forest; active Groth16 verification does not call the logger. The 2026-08-31 target for removing it with the next SP1 release has passed; the workspace still pins SP1 6.3.1, the removal is still pending and no new date is set." },
  { id = "RUSTSEC-2025-0141", reason = "bincode is inherited from SP1 6.3.1. The active Groth16 verifier uses bounded proof/public-value inputs and known-good vectors; compressed proof deserialization is not exposed. The 2026-08-31 target for the upstream SP1 migration has passed; the replacement is still pending and no new date is set." },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is a compile-time-only Orchard 0.14/getset dependency. Orchard 0.15 changes consensus proof encodings and requires a separately gated migration. The 2026-08-31 migration target has passed; the workspace is still on Orchard 0.14.0, the migration is still pending and no new date is set." },
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time dependency of pinned Alloy 1.5.7 in the Arc conformance tool; the advisory reports no vulnerability and has no safe upgrade. Remove or replace Alloy before promoting the Arc route beyond controlled testnet, target 2026-10-31." },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 (no fixed 0.5 release) stays in the root Cargo.lock only as a dependency of k256 0.13.4 through elliptic-curve 0.13.8 and ecdsa 0.16.9, and k256 appears there only as the optional, never-enabled k256 feature of alloy-primitives =1.5.7 in crates/arc-conformance. postfiat-node no longer depends on k256 (removed 2026-10-28; no source file used it), and cargo tree -i k256 --workspace --all-features --target all prints nothing. The fix needs crypto-bigint >= 0.7.9 (0.7.3 to 0.7.8 are yanked), i.e. the k256 0.14 / elliptic-curve 0.14 / ecdsa 0.17 family, and that route is blocked upstream: Alloy up to 2.5.0, SP1 up to 6.10.0, near-vm-runner and dalek-ff-group-mirror all require the 0.13 family. The tool, contract and SP1 guest locks keep their own copies, and a guest rebuild changes pinned verifying keys. Accepted 2026-10-26; cargo-deny is not run locally, so remove this entry when CI reports it unused. Plan: the k256 row of docs/plans/active/next-validator-release-plan-20261108.md." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = [
  { crate = "crossbeam-epoch@=0.9.18", reason = "RUSTSEC-2026-0204" },
  { crate = "spin@=0.9.8", reason = "version is yanked; 0.9.9 is the compatible replacement" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
